spring:
  application:
    name: allogaz
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/allogaz}
    username: ${DB_USER:allogaz}
    password: ${DB_PASSWORD:allogaz}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        timezone.default_storage: NORMALIZE_UTC
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    time-zone: Africa/Abidjan
    locale: fr
  web:
    locale: fr
    locale-resolver: fixed
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

allogaz:
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    # Poivre des hachages de codes courts (OTP, code de livraison). À surcharger en production.
    hash-pepper: ${HASH_PEPPER:dev-only-pepper-change-me}
  search:
    max-radius-meters: ${SEARCH_MAX_RADIUS_M:30000}
    candidate-limit: 50
    weights:
      distance: 0.50
      availability: 0.25
      rating: 0.15
      acceptance: 0.10
      half-score-distance-meters: 2000
      out-of-radius-factor: 0.6
  identity:
    jwt:
      # Au moins 32 octets. À surcharger en production.
      secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
      issuer: allogaz
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
    otp:
      length: 6
      ttl: ${OTP_TTL:PT5M}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      resend-cooldown: ${OTP_RESEND_COOLDOWN:PT60S}
      max-sends-per-hour: ${OTP_MAX_SENDS_PER_HOUR:5}

spring:
  application:
    name: allogaz
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/allogaz}
    username: ${DB_USER:allogaz}
    password: ${DB_PASSWORD:allogaz}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        timezone.default_storage: NORMALIZE_UTC
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    time-zone: Africa/Abidjan
    locale: fr
  web:
    locale: fr
    locale-resolver: fixed
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

allogaz:
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
